name: Screenshots

# Builds the app for the iPhone simulator, opens each main screen with fictional sample data,
# and publishes the PNGs to the `screenshots` branch. No Apple account or signing needed.
on:
  workflow_dispatch:
    inputs:
      runner:
        description: "Cloud Mac type"
        type: choice
        default: macos-26-intel
        options: [macos-26-intel, macos-26, macos-15]

permissions:
  contents: write

concurrency:
  group: screenshots
  cancel-in-progress: true

jobs:
  screenshots:
    name: Capture simulator screenshots
    runs-on: ${{ inputs.runner || vars.MAC_RUNNER || 'macos-26-intel' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Pick an iPhone simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available --json | python3 scripts/ci/pick_simulator.py)
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices | grep "$UDID" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Build for the simulator
        run: |
          scripts/ci/xcodebuild_step.sh "Build" xcodebuild build \
            -project SecondBrain.xcodeproj -scheme SecondBrain \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO

      - name: Capture screens
        timeout-minutes: 30
        run: |
          python3 -m pip install --quiet --break-system-packages pillow || python3 -m pip install --quiet pillow
          chmod +x scripts/ci/screenshots.sh
          scripts/ci/screenshots.sh "${{ steps.sim.outputs.udid }}" \
            build/DerivedData/Build/Products/Debug-iphonesimulator/SecondBrain.app screenshots

      - name: Publish to the screenshots branch
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd screenshots
          git init -q -b screenshots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Screenshots from run ${{ github.run_id }} ($(date -u +%Y-%m-%d))"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git" screenshots
          echo "Published $(ls *.png | wc -l) screenshots to the screenshots branch" >> "$GITHUB_STEP_SUMMARY"
