name: TestFlight

# Builds a signed release on a cloud Mac and uploads it to TestFlight.
# One-time setup: Docs/GITHUB_TESTFLIGHT.md (Apple Developer Program, API key, repository secrets).
# Run it from the Actions tab: TestFlight › Run workflow.
on:
  workflow_dispatch:
    inputs:
      runner:
        description: "Cloud Mac type (Intel is used by default because Apple-silicon capacity is often queued)"
        type: choice
        default: macos-26-intel
        options: [macos-26-intel, macos-26, macos-15]

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  testflight:
    name: Archive & upload to TestFlight
    # Override for every run with a repository variable MAC_RUNNER (e.g. macos-26).
    runs-on: ${{ inputs.runner || vars.MAC_RUNNER || 'macos-26-intel' }}
    timeout-minutes: 60
    env:
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      BUNDLE_ID: ${{ vars.BUNDLE_ID }}
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - name: Check one-time setup
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          missing=""
          [ -n "$TEAM_ID" ]       || missing="$missing secret:APPLE_TEAM_ID"
          [ -n "$ASC_KEY_ID" ]    || missing="$missing secret:ASC_KEY_ID"
          [ -n "$ASC_ISSUER_ID" ] || missing="$missing secret:ASC_ISSUER_ID"
          [ -n "$ASC_KEY_P8" ]    || missing="$missing secret:ASC_KEY_P8"
          [ -n "$BUNDLE_ID" ]     || missing="$missing variable:BUNDLE_ID"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository settings:$missing — see Docs/GITHUB_TESTFLIGHT.md, step 6."
            echo "### ❌ Missing setup:$missing" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "Bundle ID: $BUNDLE_ID · App Group: group.$BUNDLE_ID · Build: $BUILD_NUMBER" >> "$GITHUB_STEP_SUMMARY"

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install App Store Connect API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          KEY_PATH="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          if printf '%s' "$ASC_KEY_P8" | grep -q "BEGIN PRIVATE KEY"; then
            printf '%s\n' "$ASC_KEY_P8" > "$KEY_PATH"
          else
            # Also accept a base64-encoded .p8.
            printf '%s' "$ASC_KEY_P8" | base64 --decode > "$KEY_PATH"
          fi
          chmod 600 "$KEY_PATH"
          echo "ASC_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Archive (signed automatically with the API key)
        run: |
          scripts/ci/xcodebuild_step.sh "Archive" xcodebuild archive \
            -project SecondBrain.xcodeproj -scheme SecondBrain -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/SecondBrain.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            BASE_BUNDLE_ID="$BUNDLE_ID" \
            CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER"

      - name: Export & upload to App Store Connect
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>testFlightInternalTestingOnly</key><true/>
          </dict>
          </plist>
          EOF
          scripts/ci/xcodebuild_step.sh "Upload" xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/SecondBrain.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          {
            echo "### 🚀 Build $BUILD_NUMBER uploaded"
            echo "It appears in App Store Connect › TestFlight after Apple finishes processing (usually 5–30 minutes)."
            echo "Then open the TestFlight app on your iPhone and tap Install / Update."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove API key
        if: always()
        run: rm -f "$RUNNER_TEMP"/AuthKey_*.p8

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testflight-logs-${{ github.run_number }}
          path: build/logs
          retention-days: 14
          if-no-files-found: ignore
