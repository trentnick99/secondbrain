name: TestFlight

# Builds a signed release on a cloud Mac and uploads it to TestFlight.
# One-time setup: Docs/GITHUB_TESTFLIGHT.md (Apple Developer Program, API key, repository secrets).
# Run it from the Actions tab: TestFlight › Run workflow.
on:
  workflow_dispatch:
    inputs:
      runner:
        description: "Cloud Mac type (Intel is used by default because Apple-silicon capacity is often queued)"
        type: choice
        default: macos-26-intel
        options: [macos-26-intel, macos-26, macos-15]

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  testflight:
    name: Archive & upload to TestFlight
    # Override for every run with a repository variable MAC_RUNNER (e.g. macos-26).
    runs-on: ${{ inputs.runner || vars.MAC_RUNNER || 'macos-26-intel' }}
    timeout-minutes: 60
    env:
      # Team ID and bundle ID aren't secret; they default to the values in Config/Signing.xcconfig.
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID || 'RP964NS9GM' }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      BUNDLE_ID: ${{ vars.BUNDLE_ID || 'com.trentnick99.secondbrain' }}
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5

      - name: Check one-time setup
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          missing=""
          [ -n "$TEAM_ID" ]       || missing="$missing secret:APPLE_TEAM_ID"
          [ -n "$ASC_KEY_ID" ]    || missing="$missing secret:ASC_KEY_ID"
          [ -n "$ASC_ISSUER_ID" ] || missing="$missing secret:ASC_ISSUER_ID"
          [ -n "$ASC_KEY_P8" ]    || missing="$missing secret:ASC_KEY_P8"
          [ -n "$BUNDLE_ID" ]     || missing="$missing variable:BUNDLE_ID"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository settings:$missing — see Docs/GITHUB_TESTFLIGHT.md, step 6."
            echo "### ❌ Missing setup:$missing" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "Bundle ID: $BUNDLE_ID · App Group: group.$BUNDLE_ID · Build: $BUILD_NUMBER" >> "$GITHUB_STEP_SUMMARY"

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install App Store Connect API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          # Forgive copy-paste slips: stray spaces, Windows line endings, indented key lines.
          KEY_ID=$(printf '%s' "$ASC_KEY_ID" | tr -d '[:space:]')
          ISSUER=$(printf '%s' "$ASC_ISSUER_ID" | tr -d '[:space:]')
          echo "::add-mask::$KEY_ID"
          echo "::add-mask::$ISSUER"
          echo "ASC_KEY_ID=$KEY_ID" >> "$GITHUB_ENV"
          echo "ASC_ISSUER_ID=$ISSUER" >> "$GITHUB_ENV"
          KEY_PATH="$RUNNER_TEMP/AuthKey_${KEY_ID}.p8"
          # Rebuild a clean key file even if the paste lost its line breaks (common from a phone),
          # picked up curly dashes, or was the base64 of the whole .p8.
          python3 scripts/ci/normalize_p8.py "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "ASC_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Check the API key with Apple
        run: |
          python3 -m pip install --quiet --break-system-packages "pyjwt[crypto]" || python3 -m pip install --quiet "pyjwt[crypto]"
          python3 scripts/ci/check_asc_key.py

      - name: Restore the saved signing certificate
        uses: actions/cache@v4
        with:
          path: .ci-cache/dist-cert
          key: dist-cert-${{ github.run_id }}
          restore-keys: dist-cert-

      - name: Create distribution certificate and App Store profiles
        env:
          CERT_CACHE_DIR: .ci-cache/dist-cert
        run: python3 scripts/ci/asc_signing.py setup

      - name: Archive (signed for App Store distribution)
        run: |
          scripts/ci/xcodebuild_step.sh "Archive" xcodebuild archive \
            -project SecondBrain.xcodeproj -scheme SecondBrain -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/SecondBrain.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            BASE_BUNDLE_ID="$BUNDLE_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            SB_PROFILE_SecondBrain="$SB_PROFILE_APP" \
            SB_PROFILE_SecondBrainWidgets="$SB_PROFILE_WIDGETS" \
            SB_PROFILE_SecondBrainWatch="$SB_PROFILE_WATCH" \
            OTHER_CODE_SIGN_FLAGS="--keychain $SB_KEYCHAIN" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER"

      - name: Export & upload to App Store Connect
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>${BUNDLE_ID}</key><string>${SB_PROFILE_APP}</string>
              <key>${BUNDLE_ID}.widgets</key><string>${SB_PROFILE_WIDGETS}</string>
              <key>${BUNDLE_ID}.watchkitapp</key><string>${SB_PROFILE_WATCH}</string>
            </dict>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>testFlightInternalTestingOnly</key><false/>
          </dict>
          </plist>
          EOF
          scripts/ci/xcodebuild_step.sh "Upload" xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/SecondBrain.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          {
            echo "### 🚀 Build $BUILD_NUMBER uploaded"
            echo "It appears in App Store Connect › TestFlight after Apple finishes processing (usually 5–30 minutes)."
            echo "Then open the TestFlight app on your iPhone and tap Install / Update."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove API key and temporary keychain
        if: always()
        run: |
          python3 scripts/ci/asc_signing.py cleanup || true
          rm -f "$RUNNER_TEMP"/AuthKey_*.p8

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testflight-logs-${{ github.run_number }}
          path: build/logs
          retention-days: 14
          if-no-files-found: ignore
